---
title: Notes
description: Archive of notes.
header_title: ↩ Index
---
<section class="notes-list">
  <h2>All notes:</h2>
  {% assign notes = site.notes | sort: "date" | reverse %}
  {% for note in notes %}
    <section class="note-preview">
      <h3>
        <a href="{{ note.url | relative_url }}">{{ note.title }}</a>
      </h3>
      <span>{{ note.date | date: "%b %-d, %Y" }}</span>
    </section>
  {% endfor %}
</section>
